services:
  # Redis - 用于缓存和 Celery 消息队列
  redis:
    image: redis:7-alpine
    container_name: superset_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_MAXMEMORY=256mb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
    networks:
      - superset_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - 用于 Superset 元数据存储
  postgres:
    image: postgres:15-alpine
    container_name: superset_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - superset_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Superset Web 应用
  superset:
    build:
      context: ./docker
    image: local/superset:latest
    container_name: superset_app
    # 不覆盖镜像自带的入口点，使用镜像默认 ENTRYPOINT/CMD
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_DB: 1
      REDIS_CACHE_DB: 2
      CACHE_DEFAULT_TIMEOUT: 300
      CACHE_KEY_PREFIX: superset_
      CACHE_TYPE: RedisCache
      CACHE_REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - superset_workdir:${SUPERSET_WORKDIR:-/app/superset_home}
      - ./docker/superset_config.py:/app/superset_config.py:ro
      - ./docker/overrides/superset/tasks/celery_app.py:/app/superset/tasks/celery_app.py:ro
      - ./uploads:/app/static/uploads
    networks:
      - superset_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 5 http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Superset 初始化任务
  superset-init:
    build:
      context: ./docker
    image: local/superset:latest
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    # 挂载本地的 init 脚本以便自定义和快速修改
    volumes:
      - ./docker/docker-init.sh:/app/docker/docker-init.sh:ro
      - ./docker/superset_config.py:/app/superset_config.py:ro
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - superset_network

  # Celery Worker - 用于异步任务
  superset-worker:
    build:
      context: ./docker
    image: local/superset:latest
    container_name: superset_worker
    command: celery --app=superset.tasks.celery_app:app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_DB: 1
      REDIS_CACHE_DB: 2
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: ${SUPERSET_WORKDIR:-/app/superset_home}
    user: "${CONTAINER_USER:-1000:1000}"
    volumes:
      - superset_workdir:${SUPERSET_WORKDIR:-/app/superset_home}
      - ./docker/superset_config.py:/app/superset_config.py:ro
      - ./docker/overrides/superset/tasks/celery_app.py:/app/superset/tasks/celery_app.py:ro
    networks:
      - superset_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery' >/dev/null || exit 1; redis-cli -h redis -p 6379 PING | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s



  # Celery Beat - 用于定时任务调度
  superset-beat:
    build:
      context: ./docker
    image: local/superset:latest
    container_name: superset_beat
    command: celery --app=superset.tasks.celery_app:app beat --loglevel=info
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_DB: 1
      REDIS_CACHE_DB: 2
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: ${SUPERSET_WORKDIR:-/app/superset_home}
    user: "${CONTAINER_USER:-1000:1000}"
    volumes:
      - superset_workdir:${SUPERSET_WORKDIR:-/app/superset_home}
      - ./docker/superset_config.py:/app/superset_config.py:ro
    networks:
      - superset_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1; redis-cli -h redis -p 6379 PING | grep -q PONG || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  superset_workdir:

networks:
  superset_network:
    external:
      name: analytics_net
