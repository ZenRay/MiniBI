# MiniBI Docker Compose Environment Configuration

version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: minibiclickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_config:/etc/clickhouse-server
    environment:
      CLICKHOUSE_DB: bi_mvp
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin

  redis:
    image: redis:7-alpine
    container_name: minibiredis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass admin

  backend:
    build: ../backend
    container_name: minibibackend
    ports:
      - "8000:8000"
    depends_on:
      - clickhouse
      - redis
    env_file:
      - ./backend.env
    volumes:
      - ../backend:/app

  frontend:
    build: ../frontend
    container_name: minibifrontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend.env

volumes:
  clickhouse_data:
  redis_data:
